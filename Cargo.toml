[workspace]
resolver = "2"
members = [
    "crates/hifi-core",
    "crates/hifi-app",
    "crates/hifi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
hifi-core = { path = "crates/hifi-core" }

# gpui — zeronsh/zui, the same fork cosmos uses (backdrop blur + edge fades +
# native-view compositing above the GPU scene).
gpui = { git = "https://github.com/zeronsh/zui", rev = "c2d273dc3dadcb260b0fa7c35fc2fe02a14f5add" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "c2d273dc3dadcb260b0fa7c35fc2fe02a14f5add", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "c2d273dc3dadcb260b0fa7c35fc2fe02a14f5add" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
once_cell = "1"

wry = { version = "0.56", default-features = false, features = ["os-webview"] }

alacritty_terminal = "0.26"

# gpui is slow unoptimized; match cosmos/zed's approach for deps.
[profile.dev.package."*"]
opt-level = 3
